[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winflow"
version = "0.1.0-alpha.0"
description = "Windows-first local automatic work journal"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Winflow contributors" }
]
keywords = [
  "windows",
  "local-first",
  "time-tracking",
  "activity-tracker",
  "sqlite",
  "privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "pillow",
]

[project.urls]
Homepage = "https://github.com/AdS4TN/winflow"
Repository = "https://github.com/AdS4TN/winflow"
Issues = "https://github.com/AdS4TN/winflow/issues"

[project.scripts]
winflow = "app.main:main"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/icons/apps/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
